<script type="module">
import { chatEntries, contributorHeadline, puzzlePiecePath, roomTokenKey, validateSnapshot } from './game-view.js';
const app=document.querySelector('#app'),letters='ABCD'.split(''),packList=[['internet','How the Internet Works'],['body','The Human Body'],['money','Money Basics']];
let S={error:'',clockOffset:0,connectionStatus:'connected'},clockHandle=null,reconnectBusy=false;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,b){let r=await fetch(p,{method:b?'POST':'GET',headers:b?{'content-type':'application/json'}:{},body:b?JSON.stringify(b):null}),x=await r.json();if(!r.ok){let error=Error(x.error);error.status=r.status;error.payload=x;throw error}return x}
function shell(){return '<div class="wrap"><div class="brand"><svg class="brand-icon" viewBox="0 0 100 100" aria-hidden="true"><path d="'+puzzlePiecePath+'" fill="#176b52"/></svg>MISSING PIECE</div>'}
function packOptions(selected,includeCustom=true){return packList.map(([id,title])=>'<option value="'+id+'" '+(id===selected?'selected':'')+'>'+esc(title)+'</option>').join('')+(includeCustom?'<option value="custom" '+(selected==='custom'?'selected':'')+'>Custom pack…</option>':'')}
function home(){const param=new URLSearchParams(location.search).get('room'),c=(param||'').trim().toUpperCase(),joinOnly=param!==null,joinButton=S.rejoin?'Rejoin this room':'Join room';
app.innerHTML=shell()+(S.roomMissing?'<section class="box" style="max-width:560px;margin:32px auto;text-align:center"><div class="tag">Room unavailable</div><h1>This room has expired or can’t be found.</h1><p class="muted">Rooms are temporary. Ask the host for a fresh invite or create a new room.</p><button class="btn" id="new-room">Create a new room</button></section>':joinOnly?'<div class="head"><span class="code">'+esc(c)+'</span><div class="tag">Room invite</div><h1>Join room '+esc(c)+'</h1><p class="muted">Enter your name to take a seat with your group.</p></div><section class="box" style="max-width:520px;margin:auto"><form id="join"><input class="field" name="name" placeholder="Your name" maxlength="22" required><input type="hidden" name="code" value="'+esc(c)+'"><button class="btn">'+joinButton+'</button></form><p class="small" style="margin:14px 0 0"><a href="/">Create your own room instead</a></p></section>':'<section class="hero"><div class="tag">Cooperative study game</div><h1>Everyone has a <span style="color:#176b52">piece.</span></h1><p>Each player has different facts. Read your cards, vote privately, and discuss the full ballot if the group splits.</p></section><div class="grid"><section class="box"><h2>Create a room</h2><p class="muted">Play with 2–8 players.</p><form id="new"><input class="field" name="name" placeholder="Your name" maxlength="22" required><label for="new-pack">Study pack</label><select class="field" id="new-pack" name="packId">'+packOptions('internet',false)+'</select><button class="btn">Create room</button> <button type="button" id="demo" class="btn soft">Try it solo</button></form></section><section class="box"><h2>Join a group</h2><p class="muted">Enter the four-letter code from your host.</p><form id="join"><input class="field" name="name" placeholder="Your name" maxlength="22" required><input class="field" name="code" placeholder="ROOM CODE" maxlength="4" required><button class="btn soft">Join room</button></form></section></div>')+'<p class="error">'+esc(S.error)+'</p><p class="small" style="text-align:center">2–8 players, or try it solo | No accounts | One shared answer</p></div>';
document.querySelector('#new-room')?.addEventListener('click',()=>{S.roomMissing=false;S.error='';history.replaceState({},'','/');home()});
document.querySelector('#demo')?.addEventListener('click',()=>{const f=new FormData(document.querySelector('#new'));S.pendingDemo={name:String(f.get('name')||'').trim()||'You',packId:f.get('packId')||'internet'};showHowTo('demo')});
if(!joinOnly)document.querySelector('#new').onsubmit=async e=>{e.preventDefault();try{let f=new FormData(e.target),x=await api('/api/rooms',{name:f.get('name'),packId:f.get('packId')});enter(x)}catch(x){S.error=x.message;home()}};
document.querySelector('#join').onsubmit=async e=>{e.preventDefault();try{let f=new FormData(e.target),x=await api('/api/join',{name:f.get('name'),code:f.get('code')});enter(x)}catch(x){S.roomMissing=x.status===404&&joinOnly;S.error=S.roomMissing?'':x.message;home()}}}
function enter(x){S.chatOpen=undefined;S.chatReadThrough=0;S.packDraft=undefined;S.customDraft=undefined;S.c=x.code;S.t=x.token;S.error='';S.rejoin=false;S.connectionStatus='connecting';S.awaySeat=null;localStorage.setItem(roomTokenKey(S.c),S.t);history.replaceState({},'','/?room='+S.c);listen()}
function showAwayExpired(name){S.connectionStatus='expired';S.awaySeat={name:name||S.s?.players?.find(p=>p.id===S.s.me)?.name||'player',code:S.c};S.ws?.close();app.innerHTML=shell()+'<section class="box" role="alert" style="max-width:560px;margin:40px auto;text-align:center"><div class="tag">Seat expired</div><h1>You were away too long</h1><p class="muted">Your old seat has expired. Rejoin now and you’ll get cards at the next round.</p><button id="rejoin-away" class="btn">Rejoin as '+esc(S.awaySeat.name)+'</button></section></div>';document.querySelector('#rejoin-away').onclick=async()=>{try{const result=await api('/api/join',{code:S.awaySeat.code,name:S.awaySeat.name});enter(result)}catch(error){S.error=error.message;showAwayExpired(S.awaySeat.name)}}}
function listen(){if(S.ws&&S.ws.readyState<2)S.ws.close();const u=new URL('/api/rooms/'+S.c+'/events?token='+encodeURIComponent(S.t),location.href);u.protocol=location.protocol==='https:'?'wss:':'ws:';const socket=new WebSocket(u);S.ws=socket;socket.onopen=()=>{if(S.ws!==socket)return;S.connectionStatus='connected';if(S.s)render()};socket.onmessage=e=>{try{S.s=JSON.parse(e.data);S.clockOffset=(S.s.serverNow||Date.now())-Date.now();S.connectionStatus='connected';if(S.s.welcomeBack)S.message='Welcome back, '+(S.s.players.find(p=>p.id===S.s.me)?.name||'player')+'. You’ll get cards next round.';render()}catch(error){console.error('Room update could not be read',error);renderError()}};socket.onerror=()=>{if(S.ws===socket&&S.connectionStatus!=='expired'){S.connectionStatus='reconnecting';render()}};socket.onclose=()=>{if(S.ws!==socket||S.connectionStatus==='expired')return;S.connectionStatus='reconnecting';render();if(S.c&&S.t)setTimeout(()=>{if(S.ws===socket&&socket.readyState===3)reconnectNow()},1500)}}
async function reconnectNow(){if(reconnectBusy||!S.c||!S.t||S.connectionStatus==='expired')return;reconnectBusy=true;S.connectionStatus='reconnecting';render();try{S.s=await api('/api/rooms/'+S.c+'/state?token='+encodeURIComponent(S.t));S.clockOffset=(S.s.serverNow||Date.now())-Date.now();validateSnapshot(S.s);render();listen()}catch(error){if(error.status===404&&error.payload?.seatExpired){localStorage.removeItem(roomTokenKey(S.c));showAwayExpired(error.payload.name)}else setTimeout(reconnectNow,2500)}finally{reconnectBusy=false}}
window.addEventListener('online',()=>reconnectNow());window.addEventListener('focus',()=>{if(S.c)reconnectNow()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.c)reconnectNow()});
async function act(a,v){try{let result=await api('/api/rooms/'+S.c+'/action',Object.assign({token:S.t,action:a},v||{}));if(result.state){S.s=result.state;S.clockOffset=(S.s.serverNow||Date.now())-Date.now();S.error='';render()}}catch(e){if(e.status===404&&e.payload?.seatExpired){localStorage.removeItem(roomTokenKey(S.c));showAwayExpired(e.payload.name);return}S.error=e.message;render()}}
function cardsHtml(s){const shared=new Set(s.sharedCardIds||[]);return '<p class="share-hint">Share the cards that might help: tap Share or read them aloud.</p><b>Your fact cards</b><p class="muted">Only you can see these. Share anything helpful.</p>'+(s.meActive?s.cards.map(f=>'<div class="fact"><div class="fact-header"><b>Fact '+f.id+'</b><button class="btn soft fact-share" data-share="'+f.id+'" '+(shared.has(f.id)||s.paused?'disabled':'')+'>'+(shared.has(f.id)?'Shared':'Share')+'</button></div><div>'+esc(f.text)+'</div></div>').join(''):'<p class="small">Your cards arrive at the next round.</p>')}
function playerTag(s,id,name){if(s.demo&&id===s.me)return 'You';const p=s.players.find(player=>player.id===id),bot=!!p?.isBot,display=bot?String(name).replace(/\s*\(Bot\)$/i,''):name;return esc(display)+(bot?'<small class="bot-tag">bot</small>':'')}
function chatPanel(s){const mobileRound=s.phase==='round'&&window.matchMedia('(max-width:700px)').matches,open=S.chatOpen===undefined?(!!s.demo||mobileRound):S.chatOpen,messages=chatEntries(s.chat||[]),content=messages.filter(m=>m.type!=='round-divider'),latest=content.reduce((max,m)=>Math.max(max,m.seq||0),0);if(open)S.chatReadThrough=Math.max(S.chatReadThrough||0,latest);const unread=content.filter(m=>Number.isInteger(m.seq)&&m.seq>(S.chatReadThrough||0)).length,items=messages.map(m=>{if(m.type==='round-divider')return '<div class="chat-divider" role="separator"><span>Round '+m.roundNumber+'</span></div>';const legacyPrefix=m.name+' shared: ',legacyShared=!m.type&&m.text?.startsWith(legacyPrefix),shared=m.type==='shared-card'||legacyShared,text=legacyShared?m.text.slice(legacyPrefix.length):m.text;return shared?'<article class="shared-card-message"><b class="chat-author">'+playerTag(s,m.id,m.name)+'</b><span class="shared-card-label">shared a card</span><div class="chat-message">'+esc(text)+'</div></article>':'<div class="row"><b class="chat-author">'+playerTag(s,m.id,m.name)+'</b><span class="chat-message">'+esc(text)+'</span></div>'}).join(''),empty=content.length?'':'<p class="small">No messages yet.</p>';return '<details class="box chat-panel" '+(open?'open':'')+'><summary><span class="chat-arrow" aria-hidden="true"></span><span class="chat-open-label">Open chat</span><span class="chat-closed-label">Team chat</span><span class="chat-unread" '+(unread?'':'hidden')+'>'+unread+' new</span></summary><form class="chat-form"><input class="field" name="text" maxlength="240" placeholder="Share a useful fact..." required><button class="btn soft">Send</button></form><div class="chat-messages">'+empty+items+'</div></details>'}
function syncChatReadState(open){const messages=(S.s?.chat||[]).filter(message=>message.type!=='round-divider'),latest=messages.reduce((max,message)=>Math.max(max,message.seq||0),0);if(open)S.chatReadThrough=Math.max(S.chatReadThrough||0,latest);const count=messages.filter(message=>Number.isInteger(message.seq)&&message.seq>(S.chatReadThrough||0)).length;document.querySelectorAll('.chat-unread').forEach(badge=>{badge.textContent=count+' new';badge.hidden=!count})}
function playerManagement(s){return s.isHost?'<details class="box player-management"><summary>Manage players</summary>'+s.players.filter(p=>p.id!==s.me&&!p.isBot).map(p=>'<div class="row">'+esc(p.name)+(p.away?' <span class="away-player">away</span>':p.reconnecting?' <span class="small">reconnecting</span>':'')+(p.pending?' <span class="small">joins next round</span>':'')+'<button class="btn soft" data-remove="'+p.id+'">Remove</button></div>').join('')+'</details>':''}
const examplePack='TOPIC: Sample Topic\nFACT 1: First useful fact\nFACT 2: Second useful fact\nFACT 3: Third useful fact\nFACT 4: Fourth useful fact\nFACT 5: Fifth useful fact\nFACT 6: Sixth useful fact\nQ: What can we infer from facts 1 and 2? | A) A plausible correct explanation using both facts | B) A believable misconception that fact 1 rules out | C) A believable misconception that fact 2 rules out | D) A plausible alternative that conflicts with both facts | ANSWER: A | NEEDS: 1,2\nQ: How do facts 3 and 4 fit together? | A) A plausible incorrect explanation that fact 3 rules out | B) A plausible correct explanation using both facts | C) A believable misconception that fact 4 rules out | D) A plausible alternative that conflicts with both facts | ANSWER: B | NEEDS: 3,4\nQ: What do facts 5 and 6 explain together? | A) A plausible incorrect explanation that fact 5 rules out | B) A believable misconception that fact 6 rules out | C) A plausible correct explanation using both facts | D) A plausible alternative that conflicts with both facts | ANSWER: C | NEEDS: 5,6';
const aiPrompt='Turn my notes into a Missing Piece custom pack using exactly this format:\nTOPIC: <short title>\nFACT 1: <one clear, accurate fact>\n...\nQ: <question> | A) <choice> | B) <choice> | C) <choice> | D) <choice> | ANSWER: <A/B/C/D> | NEEDS: <fact numbers, e.g. 2,5>\n\nRules: Create 6-12 numbered facts and 3-8 questions. Every question must require 2-3 listed facts. Every needed fact must independently rule out at least one wrong choice. Wrong choices should be believable misconceptions, not silly answers. Keep all four choices similar in length and make exactly one correct. Use only the provided notes; do not invent facts. Output only the pack in the specified format.\n\nMy notes:\n[PASTE NOTES HERE]';
function lobby(s){const selectedPack=S.packDraft??s.packId,isCustom=selectedPack==='custom',draft=S.customDraft??s.customPackText??'';return shell()+'<div class="head"><span class="code">'+s.code+'</span><div class="tag">Lobby - '+esc(s.packTitle)+'</div><h1>Gather your group.</h1><p class="muted">Read your cards, vote in secret, then compare the ballot.</p></div><div class="cols"><section class="box"><b>Players - '+s.count+' / 8</b>'+s.players.map(p=>'<div class="row">'+esc(p.name)+(p.id===s.me?' (you)':'')+(p.pending?' <span class="small">joins next round</span>':'')+(p.away?' <span class="away-player">away</span>':p.reconnecting?' <span class="small">reconnecting</span>':'')+(p.host?'<b class="host">HOST</b>':'')+(s.isHost&&p.id!==s.me&&!p.isBot?'<button class="btn soft" data-remove="'+p.id+'">Remove</button>':'')+'</div>').join('')+(s.isHost?'<label for="lobby-pack">Pack</label><select id="lobby-pack" class="field">'+packOptions(selectedPack)+'</select><div id="custom-controls" class="custom-pack" '+(isCustom?'':'hidden')+'><label for="custom-pack-text">Paste your pack</label><textarea id="custom-pack-text" class="field" placeholder="TOPIC: ...&#10;FACT 1: ...&#10;...&#10;Q: ... | A) ... | B) ... | C) ... | D) ... | ANSWER: B | NEEDS: 2,5">'+esc(draft)+'</textarea><div class="custom-tools"><button type="button" id="copy-example" class="btn soft">Copy example format</button><button type="button" id="copy-prompt" class="btn soft">Copy AI prompt</button></div><div id="pack-copy-status" class="status small" aria-live="polite"></div><p class="small">Use 6-12 facts and 3-8 questions. The answer stays hidden until reveal.</p></div><label for="duration">Round timer</label><select id="duration" class="field"><option value="60" '+(s.duration===60?'selected':'')+'>60 seconds</option><option value="90" '+(s.duration===90?'selected':'')+'>90 seconds</option><option value="120" '+(s.duration===120?'selected':'')+'>120 seconds</option></select>':'<p class="muted">Host selects the pack and timer before starting.</p>')+'<p><button id="start" class="btn" '+(!s.isHost||s.count<2?'disabled':'')+'>Start game</button> <span class="small">'+(s.count<2?'Need at least 2 players.':'')+'</span></p></section><aside class="box"><b>Invite your group</b><p class="muted">Share the code or link.</p><input class="field" id="link" readonly value="'+location.origin+'/?room='+s.code+'"><button id="copy" class="btn soft">Copy link</button> <button id="howto" class="btn soft">How to play</button><p class="muted">Votes stay hidden until everyone has voted. If the ballot splits, compare cards and vote again.</p></aside></div><p class="error">'+esc(S.error)+'</p></div>'}
function timerHtml(s){if(s.paused)return '<div class="timer warning">Paused — waiting for at least 2 connected players.</div>';const remaining=Math.max(0,Math.ceil((s.roundEndsAt-(Date.now()+S.clockOffset))/1000));return '<div id="timer" class="timer '+(remaining<=10?'warning':'')+'" role="timer" aria-live="polite">'+(remaining<=10&&remaining>0?remaining+' seconds left':'Time left: '+remaining+'s')+'</div>'}
function voteList(s){return (s.voteReveal||[]).map(v=>'<div class="row"><b>'+playerTag(s,v.id,v.name)+'</b><span class="small" style="margin-left:auto">picked '+letters[v.pick]+'</span></div>').join('')}
function round(s){const total=s.connectedCount??s.count,voted=s.voteReveal?s.voteReveal.length:s.votedCount,showReveal=!!s.voteReveal,options=s.question.choices.map((c,i)=>'<button class="choice" data-i="'+i+'" '+(showReveal||s.paused||!s.meActive?'disabled':'')+'><span class="choice-copy"><b>'+letters[i]+'.</b><span>'+esc(c)+'</span></span></button>').join('');
const reconnecting=s.players.filter(p=>p.reconnecting&&!p.pending).map(p=>esc(p.name)+' · '+Math.max(0,Math.ceil((p.reconnectingUntil-s.serverNow)/1000))+'s to reconnect').join(', ');
const away=s.players.filter(p=>p.away).map(p=>esc(p.name)).join(', '),reconnectNotice=(reconnecting?'<p class="small">Reconnecting: '+reconnecting+'</p>':'')+(away?'<p class="small">Away: '+away+'</p>':'');
const voteMessage=s.paused?'<p class="agreement">The round is paused until at least two players reconnect.</p>':!s.meActive?'<p class="agreement">You joined during this round. Your cards and vote open next round.</p>':showReveal?'<p class="agreement">Not unanimous. Compare your cards and vote again.</p><div aria-label="Revealed votes">'+voteList(s)+'</div>':'<p class="agreement">'+voted+' of '+total+' connected players have voted.</p><p class="small">Votes stay secret until everyone has voted. You can change your vote before then.</p>';
return shell()+'<div class="head"><span class="code">'+s.code+'</span><div class="tag">Round '+s.roundNumber+' of '+s.totalRounds+' | '+esc(s.packTitle)+'</div><h1>Find the missing piece.</h1>'+timerHtml(s)+'</div><div class="game-grid"><section class="box game-main"><div class="question">'+esc(s.question.text)+'</div><div class="mobile-cards">'+cardsHtml(s)+'<div class="round-chat-mobile">'+chatPanel(s)+'</div></div>'+reconnectNotice+options+voteMessage+'</section><aside class="box game-side"><div class="desktop-cards">'+cardsHtml(s)+'</div><div class="round-chat-desktop">'+chatPanel(s)+'</div>'+playerManagement(s)+'</aside></div><p class="error">'+esc(S.error)+'</p></div>'}
function reveal(s){const result=s.roundResult||{},status=result.timedOut?'Time ran out before everyone agreed. This round was missed.':result.correct?'Correct! The group found the answer.':'The group agreed on a different answer, so this round was missed.';
const nextLabel=s.roundNumber===s.totalRounds?'See final score':'Next question';
return shell()+'<div class="head"><div class="tag">Round '+s.roundNumber+' reveal</div><h1>'+(result.correct?'You found the piece.':result.timedOut?'Time is up.':'Not quite.')+'</h1></div><div class="cols"><section class="box"><div class="question">'+letters[s.question.answer]+'. '+esc(s.question.choices[s.question.answer])+'</div><p class="muted">'+status+'</p>'+(result.correct?'<p><b>+'+result.points+' points</b> | '+result.bonus+' time bonus</p>':'')+'<p class="muted">Group picks:</p>'+(result.timedOut&&!s.voteReveal?'<p class="small">Time ran out before everyone voted.</p>':voteList(s)||'<p class="small">No picks were recorded.</p>')+'<p class="muted">Needed facts:</p>'+s.reveal.map(f=>'<div class="fact"><b>Fact '+f.id+' - '+playerTag(s,f.whoId,f.who)+' had this</b><br>'+esc(f.text)+'</div>').join('')+(s.isHost?'<div class="actions"><button id="next" class="btn">'+nextLabel+'</button></div>':'<p class="small">Waiting for the host to continue.</p>')+'</section><aside class="box"><div class="tag">The full picture</div><h2>'+esc(contributorHeadline(s.reveal))+'.</h2><p class="muted">The cards combined to reveal how these facts fit together.</p><div class="stat">Team score<b>'+s.score+'</b></div><div class="stat">Correct rounds<b>'+s.correctCount+' / '+s.totalRounds+'</b></div></aside></div><p class="error">'+esc(S.error)+'</p></div>'}
function elapsed(ms){if(ms==null)return '-';const seconds=ms/1000;return seconds<60?seconds.toFixed(1)+'s':Math.floor(seconds/60)+'m '+Math.floor(seconds%60)+'s'}
function endScreen(s){const outcomes=s.roundOutcomes||[],solved=outcomes.filter(Boolean).length,verdict=solved===s.totalRounds?'Perfect teamwork. You solved every round!':solved===0?'Every round gave your team a chance to learn how to combine the clues.':solved<s.totalRounds/2?'You found '+solved+' piece'+(solved===1?'':'s')+' together. Keep sharing what you know—you’re building the skill.':'Great teamwork—you solved '+solved+' of '+s.totalRounds+' rounds.';const shape=puzzlePiecePath;return shell()+'<div class="head"><div class="tag">Game complete - '+esc(s.packTitle)+'</div><h1>Look at what you built together.</h1></div><section class="box" style="max-width:820px;margin:auto"><div class="pieces" role="img" aria-label="'+solved+' of '+s.totalRounds+' rounds solved">'+Array.from({length:s.totalRounds},(_,i)=>'<span class="piece '+(outcomes[i]?'solved':'')+'" aria-hidden="true"><svg viewBox="0 0 100 100" focusable="false"><path d="'+shape+'"/></svg></span>').join('')+'</div><p class="muted" style="text-align:center">'+esc(verdict)+'</p><div class="stat">Team score<b>'+s.score.toLocaleString()+'</b></div><div class="stat">Correct answers<b>'+s.correctCount+' / '+s.totalRounds+'</b></div><div class="stat">Fastest correct round<b>'+(s.fastestRound?'Round '+s.fastestRound.round+' | '+elapsed(s.fastestRound.elapsedMs):'No correct rounds yet')+'</b></div><div class="stat">MVP Piece<b>'+(s.mvp?esc(s.mvp.name)+' | held a missing piece in '+s.mvp.count+' solved '+(s.mvp.count===1?'round':'rounds'):'No MVP yet — solve a round to earn it')+'</b></div>'+(s.isHost?'<div class="actions"><button id="play-again" class="btn">Play Again</button><button id="new-pack" class="btn soft">New pack</button></div>':'<p class="muted">Waiting for the host to start another game.</p>')+'</section><p class="error">'+esc(S.error)+'</p></div>'}
function showHowTo(target){S.howActive=true;S.howTarget=target;S.howStep=0;renderHowTo()}
function launchDemo(){const d=S.pendingDemo||{name:'You',packId:'internet'};api('/api/rooms',{name:String(d.name||'').trim()||'You',packId:d.packId||'internet',demo:true}).then(enter).catch(e=>{S.error=e.message;S.howActive=false;home()})}
function renderHowTo(){const steps=[['Read your cards','Play with 2–8 players. Each player gets private facts. Tap Share on a card or read it aloud to help explain the question.'],['Vote in secret','Choose an answer. No one sees individual picks until every connected player has voted.'],['Compare and retry','If picks differ, compare your cards, talk it through, and vote again before time runs out.']];const step=steps[S.howStep],nameField=S.howTarget==='demo'?'<label for="demo-name">Your name (optional)</label><input class="field" id="demo-name" name="demo-name" maxlength="22" placeholder="You" value="'+esc(S.pendingDemo?.name||'You')+'"><p class="small">We’ll call you You if you leave this blank.</p>':'';app.innerHTML=shell()+'<section class="box" style="max-width:650px;margin:32px auto"><div class="tag">How to play · Step '+(S.howStep+1)+' of 3</div><h1>'+step[0]+'</h1><p class="muted">'+step[1]+'</p>'+nameField+'<div class="actions"><button id="how-skip" class="btn soft">Skip</button><button id="how-next" class="btn">'+(S.howStep<2?'Next':S.howTarget==='demo'?'Start solo demo':'Back to lobby')+'</button></div></section></div>';document.querySelector('#demo-name')?.addEventListener('input',e=>{S.pendingDemo.name=e.target.value});document.querySelector('#how-skip').onclick=()=>finishHowTo(true);document.querySelector('#how-next').onclick=()=>S.howStep<2?(S.howStep++,renderHowTo()):finishHowTo(false)}
function finishHowTo(skip){localStorage.setItem('mp:howto-seen','1');S.howActive=false;if(S.howTarget==='demo')launchDemo();else render()}
function renderError(){clearInterval(clockHandle);app.innerHTML=shell()+'<section class="box" role="alert"><div class="tag">Room update</div><h1>We could not display the latest game state.</h1><p class="muted">The room sent information this page could not use. Try reloading to reconnect. If the issue continues, ask the host to create a new room.</p><button class="btn" id="reload-room">Reload room</button></section></div>';document.querySelector('#reload-room')?.addEventListener('click',()=>location.reload())}
function render(){clearInterval(clockHandle);if(S.howActive){renderHowTo();return}const s=S.s;try{validateSnapshot(s);const view=s.phase==='lobby'?lobby(s):s.phase==='round'?round(s):s.phase==='reveal'?reveal(s):endScreen(s);app.innerHTML=view.replace('<p class="error">',(s.phase==='round'?'':chatPanel(s))+'<p class="error">').replace('<div class="head">','<div class="head">'+(S.message?'<p class="welcome-back" role="status">'+esc(S.message)+'</p>':''));S.message='';if(S.connectionStatus==='reconnecting')app.insertAdjacentHTML('afterbegin','<div class="connection-banner" role="status">Reconnecting…</div>')}catch(error){console.error('Room state could not be rendered',error);renderError();return}

if(s.phase==='lobby'&&!localStorage.getItem('mp:howto-seen')){showHowTo('lobby');return}
document.querySelector('#howto')?.addEventListener('click',()=>showHowTo('lobby'));
document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>act('remove-player',{playerId:b.dataset.remove})));
document.querySelectorAll('.chat-panel').forEach(panel=>panel.addEventListener('toggle',e=>{S.chatOpen=e.currentTarget.open;syncChatReadState(e.currentTarget.open)}));
document.querySelectorAll('.chat-form').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const input=e.target.elements.text;act('chat',{text:input.value});input.value=''}));
document.querySelectorAll('[data-share]').forEach(button=>button.addEventListener('click',()=>act('share',{factId:+button.dataset.share})));
document.querySelector('#lobby-pack')?.addEventListener('change',e=>{S.packDraft=e.target.value;document.querySelector('#custom-controls').hidden=e.target.value!=='custom'});
document.querySelector('#custom-pack-text')?.addEventListener('input',e=>{S.customDraft=e.target.value});
document.querySelector('#copy-example')?.addEventListener('click',()=>copyText(examplePack,'Example format copied.'));
document.querySelector('#copy-prompt')?.addEventListener('click',()=>copyText(aiPrompt,'AI prompt copied.'));
document.querySelector('#start')?.addEventListener('click',()=>{const packId=document.querySelector('#lobby-pack').value;act('start',{packId,duration:+document.querySelector('#duration').value,customPackText:packId==='custom'?document.querySelector('#custom-pack-text').value:undefined})});
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>act('pick',{choice:+b.dataset.i}));
document.querySelector('#next')?.addEventListener('click',()=>act('next'));
document.querySelector('#play-again')?.addEventListener('click',()=>act('play-again'));
document.querySelector('#new-pack')?.addEventListener('click',()=>act('new-pack'));
document.querySelector('#copy')?.addEventListener('click',()=>navigator.clipboard.writeText(document.querySelector('#link').value));
if(s.phase==='lobby'&&!localStorage.getItem('mp:howto-seen'))return
if(s.phase==='round'&&!s.paused){clockHandle=setInterval(()=>{const el=document.querySelector('#timer');if(!el)return;const seconds=Math.max(0,Math.ceil((s.roundEndsAt-(Date.now()+S.clockOffset))/1000));el.textContent=seconds<=10&&seconds>0?seconds+' seconds left':'Time left: '+seconds+'s';el.classList.toggle('warning',seconds<=10)},250)}
}
function copyText(text,message){const status=document.querySelector('#pack-copy-status');navigator.clipboard.writeText(text).then(()=>{if(status)status.textContent=message}).catch(()=>{if(status)status.textContent='Copy was blocked by this browser. Select and copy the text manually.'})}
async function restore(){const c=(new URLSearchParams(location.search).get('room')||'').trim().toUpperCase(),t=localStorage.getItem(roomTokenKey(c));if(c&&!/^[A-Z0-9]{4}$/.test(c))S.roomMissing=true;if(c&&t){try{S.c=c;S.t=t;S.s=await api('/api/rooms/'+c+'/state?token='+encodeURIComponent(t));S.clockOffset=(S.s.serverNow||Date.now())-Date.now();validateSnapshot(S.s);listen();return}catch(error){if(error.status===404){if(error.payload?.seatExpired){showAwayExpired(error.payload.name);return}localStorage.removeItem(roomTokenKey(c));S.t=null;S.s=null;if(/Room expired or not found/i.test(error.message)){S.roomMissing=true;S.error=''}else{S.rejoin=true;S.error='Your saved seat was not recognized. Enter your name to rejoin this room.'}}else if(S.s){renderError();return}else{S.error='Could not reconnect to this room. Check your connection and try again.'}}}else if(c&&!S.roomMissing){try{await api('/api/rooms/'+c+'/exists')}catch(error){if(error.status===404)S.roomMissing=true;else S.error='Could not check this room. Try again.'}}home()}restore()
</script>
